name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CYBERCHEF_VERSION: v11.5.0    # https://github.com/gchq/CyberChef/releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history for enableGitInfo / lastmod
          submodules: true        # the theme (themes/wem)

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Hugo and the tools' libraries (pinned in package-lock.json)
        run: npm ci

      - name: Unit tests of the tools' logic
        run: npm test

      - name: Fetch CyberChef (official release, served from /cyberchef/)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CYBERCHEF_VERSION" -R gchq/CyberChef -p '*.zip' -D /tmp/cc
          mkdir -p static/cyberchef
          unzip -q /tmp/cc/*.zip -d static/cyberchef
          mv static/cyberchef/CyberChef_*.html static/cyberchef/index.html
          ls static/cyberchef

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          HUGO_CYBERCHEF_VERSION: ${{ env.CYBERCHEF_VERSION }}
        run: npm run build -- --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
