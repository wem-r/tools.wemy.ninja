<div class="tk-field"><div class="tk-label"><span>text or URL</span></div><textarea id="in" spellcheck="false">https://tools.wemy.ninja/</textarea></div>
<div class="tk-row"><span class="dim">error correction</span><select id="ec"><option value="L">L 7 %</option><option value="M" selected>M 15 %</option><option value="Q">Q 25 %</option><option value="H">H 30 %</option></select>
  <label>size <input type="number" id="size" value="320" min="64" max="2000"></label><label>margin <input type="number" id="margin" value="2" min="0" max="10"></label>
  <label>colour <input type="color" id="fg" value="#040f1e"></label><label>background <input type="color" id="bg" value="#ffffff"></label>
  <button type="button" class="tk-btn primary" id="png">save PNG</button><button type="button" class="tk-btn" id="svg">save SVG</button></div>
<div class="tk-msg" id="msg"></div>
<canvas id="cv" style="border-radius:4px;max-width:100%"></canvas>
