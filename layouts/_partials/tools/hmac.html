<div class="tk-grid">
  <div class="tk-field"><div class="tk-label"><span>key</span><div class="tk-seg">
    <label><input type="radio" name="kfmt" value="utf8" checked><span>utf-8</span></label>
    <label><input type="radio" name="kfmt" value="hex"><span>hex</span></label>
    <label><input type="radio" name="kfmt" value="base64"><span>base64</span></label></div></div>
    <input id="key" value="secret" spellcheck="false" autocomplete="off"></div>
  <div class="tk-field"><div class="tk-label"><span>algorithm</span></div>
    <select id="alg"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option><option>SHA-224</option><option>SHA-1</option>
      <option>SHA3-256</option><option>SHA3-512</option><option>MD5</option><option value="ALL">all of them</option></select></div>
</div>
<div class="tk-field"><div class="tk-label"><span>message</span><div class="tk-seg">
  <label><input type="radio" name="fmt" value="utf8" checked><span>utf-8</span></label>
  <label><input type="radio" name="fmt" value="hex"><span>hex</span></label>
  <label><input type="radio" name="fmt" value="base64"><span>base64</span></label></div></div>
  <textarea id="txt" spellcheck="false">The quick brown fox jumps over the lazy dog</textarea></div>
<div class="tk-msg" id="msg"></div>
<table class="tk-kv" id="out"></table>
<div class="tk-sec">verify</div>
<div class="tk-field"><input id="expect" placeholder="paste an expected HMAC (hex or base64) to compare" spellcheck="false" autocomplete="off"></div>
<div class="tk-msg" id="vmsg"></div>
