<div class="tk-grid">
  <div class="tk-field"><div class="tk-label"><span>title</span></div><input id="title" value="Wem's tools" spellcheck="false"></div>
  <div class="tk-field"><div class="tk-label"><span>URL</span></div><input id="url" value="https://tools.wemy.ninja/" spellcheck="false"></div>
  <div class="tk-field" style="grid-column:1/-1"><div class="tk-label"><span>description</span><span class="r dim" id="dlen"></span></div><textarea id="desc" spellcheck="false">Small security &amp; sysadmin tools that run entirely in your browser.</textarea></div>
  <div class="tk-field"><div class="tk-label"><span>image URL (1200×630)</span></div><input id="img" value="https://tools.wemy.ninja/og.png" spellcheck="false"></div>
  <div class="tk-field"><div class="tk-label"><span>site name</span></div><input id="site" value="wemy.ninja" spellcheck="false"></div>
  <div class="tk-field"><div class="tk-label"><span>type</span></div><select id="type"><option>website</option><option>article</option><option>profile</option><option>product</option></select></div>
  <div class="tk-field"><div class="tk-label"><span>Twitter / X handle</span></div><input id="tw" value="" placeholder="@account" spellcheck="false"></div>
  <div class="tk-field"><div class="tk-label"><span>locale</span></div><input id="loc" value="en_GB" spellcheck="false"></div>
  <div class="tk-field"><div class="tk-label"><span>theme colour</span></div><input type="color" id="col" value="#040f1e"></div>
</div>
<div class="tk-row"><label class="chk"><input type="checkbox" id="noindex">noindex, nofollow</label><label class="chk"><input type="checkbox" id="large" checked>large image card</label></div>
<div class="tk-field"><div class="tk-label"><span>&lt;head&gt; tags</span><span class="r"><button type="button" class="tk-copy" data-copy="#out">copy</button></span></div><textarea id="out" class="tall" readonly spellcheck="false"></textarea></div>
