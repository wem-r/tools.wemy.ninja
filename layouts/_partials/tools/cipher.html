{{- /* Cipher Suite page: the form is built by assets/tools/cipher.js from the registry (assets/tools/lib/ciphers). */ -}}
<div id="cipher" data-id="{{ .Params.cipher }}">
  <div class="tk-row" id="modes"></div>
  <div class="tk-grid" id="params"></div>
  <div class="tk-field"><div class="tk-label"><span>input</span><span class="r"><button type="button" class="tk-btn" id="sample">sample</button><button type="button" class="tk-btn" id="swap" title="use the output as input">⇅ swap</button></span></div>
    <textarea id="in" spellcheck="false"></textarea></div>
  <div class="tk-msg" id="msg"></div>
  <div class="tk-field" id="outbox"><div class="tk-label"><span>output</span><span class="r dim" id="len"></span><span class="r"><button type="button" class="tk-copy" data-copy="#out">copy</button></span></div>
    <textarea id="out" readonly spellcheck="false"></textarea></div>
  <div class="tk-scroll" id="tablebox" hidden><table class="tk-list" id="tbl"></table></div>
</div>
<noscript><p class="tk-msg warn">This tool needs JavaScript (it runs entirely in your browser).</p></noscript>
