{{- /* PDF drop zone + status line + progress bar. Params: text, multiple, accept */ -}}
<label class="tk-drop" id="drop"><input type="file" hidden accept="{{ .accept | default ".pdf,application/pdf" }}"{{ if .multiple }} multiple{{ end }}><span>{{ .text | default "drop a PDF here, or click to choose — it is processed in your browser, never uploaded" }}</span></label>
<div class="tk-progress" id="bar" hidden><i></i></div>
<div class="tk-msg" id="msg"></div>
