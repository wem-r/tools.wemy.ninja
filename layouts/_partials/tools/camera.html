<div class="tk-row"><button type="button" class="tk-btn primary" id="start">start camera</button><select id="dev"></select><label class="chk"><input type="checkbox" id="audio">with sound</label>
  <button type="button" class="tk-btn" id="photo" disabled>📷 photo</button><button type="button" class="tk-btn" id="rec" disabled>⏺ record</button><button type="button" class="tk-btn" id="stop">stop</button><span class="dim" id="time"></span></div>
<div class="tk-msg" id="msg"></div>
<video id="v" playsinline muted style="max-width:100%;max-height:420px;border-radius:4px;background:#000" hidden></video>
<div class="tk-pages" id="shots"></div>
<p class="dim">Photos and videos stay in this page until you save them; closing the tab discards them.</p>
