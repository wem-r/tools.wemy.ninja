<div class="tk-sec">identify a number</div>
<div class="tk-row">
  <div class="tk-field" style="flex:1;margin:0"><div class="tk-label"><span>paste a timestamp value</span></div><input id="num" value="133000000000000000" spellcheck="false" autocomplete="off"></div>
  <button type="button" class="tk-btn" id="nowbtn" style="align-self:flex-end">now</button>
</div>
<table class="tk-list" id="interp"></table>
<div class="tk-sec">from a date</div>
<div class="tk-field" style="max-width:280px"><div class="tk-label"><span>date &amp; time (your local zone)</span></div><input id="dt" type="datetime-local" step="1"></div>
<table class="tk-kv" id="enc"></table>
<p class="dim">The top table reads one number as every format so you can see which one gives a sensible date (highlighted). All times UTC.</p>
