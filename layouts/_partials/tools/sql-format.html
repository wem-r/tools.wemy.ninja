  <div class="tk-field"><textarea id="in" class="tall" spellcheck="false">select u.id, u.name, count(o.id) as orders from users u left join orders o on o.user_id = u.id where u.created_at > '2026-01-01' and u.active = 1 group by u.id, u.name having count(o.id) > 3 order by orders desc limit 10;</textarea></div>
