<div class="tk-field"><div class="tk-label"><span>text</span><span class="r dim" id="cnt"></span></div><textarea id="in" class="tall" spellcheck="false"></textarea></div>
<div class="tk-field"><div class="tk-label"><span>shown with hidden characters marked</span></div><pre class="tk-out" id="vis"></pre></div>
<table class="tk-list" id="list"></table>
<div class="tk-sec">clean</div>
<div class="tk-row">
  <label class="chk"><input type="checkbox" data-k="invisible" checked>zero-width &amp; invisible</label><label class="chk"><input type="checkbox" data-k="bidi" checked>bidi controls</label>
  <label class="chk"><input type="checkbox" data-k="tag" checked>tag characters</label><label class="chk"><input type="checkbox" data-k="control" checked>control characters</label>
  <label class="chk"><input type="checkbox" data-k="space">odd spaces → space</label><label class="chk"><input type="checkbox" data-k="confusable">look-alikes → Latin</label>
  <label class="chk"><input type="checkbox" data-k="variation">variation selectors</label><label class="chk"><input type="checkbox" data-k="private">private use</label>
</div>
<div class="tk-field"><div class="tk-label"><span>cleaned</span><span class="r"><button type="button" class="tk-copy" data-copy="#clean">copy</button></span></div><textarea id="clean" readonly spellcheck="false"></textarea></div>
