<div class="tk-row"><div class="tk-seg">
  <label><input type="radio" name="mode" value="password" checked><span>password</span></label>
  <label><input type="radio" name="mode" value="passphrase"><span>passphrase</span></label>
  <label><input type="radio" name="mode" value="token"><span>token</span></label>
</div><button type="button" class="tk-btn primary" id="go">generate</button></div>
<div data-mode="password">
  <div class="tk-row"><label>length <input type="number" id="len" min="4" max="256" value="20"></label>
    <label class="chk"><input type="checkbox" id="lo" checked>a-z</label><label class="chk"><input type="checkbox" id="up" checked>A-Z</label>
    <label class="chk"><input type="checkbox" id="di" checked>0-9</label><label class="chk"><input type="checkbox" id="sy" checked>!@#…</label>
    <label class="chk"><input type="checkbox" id="amb">no look-alikes (Il1O0)</label></div>
  <div class="tk-field"><div class="tk-label"><span>extra characters / symbols set</span></div><input id="set" value="!@#$%^&amp;*()-_=+[]{};:,.?/" spellcheck="false" class="short"></div>
</div>
<div data-mode="passphrase" hidden>
  <div class="tk-row"><label>words <input type="number" id="words" min="3" max="20" value="6"></label>
    <label>separator <input id="sep" value="-" class="short" style="width:4em" maxlength="3"></label>
    <label class="chk"><input type="checkbox" id="cap">Capitalise</label><label class="chk"><input type="checkbox" id="num">add a digit</label></div>
  <input type="hidden" id="eff" value="{{ (partial "data/eff.html" .).RelPermalink }}">
</div>
<div data-mode="token" hidden>
  <div class="tk-row"><label>bytes <input type="number" id="bytes" min="4" max="512" value="32"></label><div class="tk-seg">
    <label><input type="radio" name="tfmt" value="hex" checked><span>hex</span></label>
    <label><input type="radio" name="tfmt" value="b64url"><span>base64url</span></label>
    <label><input type="radio" name="tfmt" value="b64"><span>base64</span></label>
    <label><input type="radio" name="tfmt" value="b32"><span>base32</span></label></div></div>
</div>
<div class="tk-row"><label>how many <input type="number" id="count" min="1" max="100" value="5"></label><span class="dim" id="ent"></span></div>
<table class="tk-kv" id="out"></table>
