<div class="tk-sec">build</div>
<div class="tk-row"><div class="tk-seg">
  <label><input type="radio" name="kind" value="basic" checked><span>Basic</span></label>
  <label><input type="radio" name="kind" value="bearer"><span>Bearer</span></label>
</div></div>
<div class="tk-grid" data-kind="basic">
  <div class="tk-field"><div class="tk-label"><span>user</span></div><input id="user" value="wem" spellcheck="false" autocomplete="off"></div>
  <div class="tk-field"><div class="tk-label"><span>password</span></div><input id="pass" value="hunter2" spellcheck="false" autocomplete="off"></div>
</div>
<div class="tk-field" data-kind="bearer" hidden><div class="tk-label"><span>token</span></div><input id="token" value="eyJhbGciOiJIUzI1NiJ9.e30.ZRrHA1JJJW8opsbCGfG_HACGpVUMN_a9IV7pAx_Zmeo" spellcheck="false" autocomplete="off"></div>
<table class="tk-kv" id="out"></table>
<div class="tk-sec">decode</div>
<div class="tk-field"><input id="dec" value="Authorization: Basic d2VtOmh1bnRlcjI=" spellcheck="false" autocomplete="off" placeholder="paste an Authorization header or its value"></div>
<div class="tk-msg" id="msg"></div>
<table class="tk-kv" id="dout"></table>
<p class="dim">Basic auth is only base64, not encryption: anyone who sees the header has the password. Send it over HTTPS only.</p>
