<div class="tk-row"><label>width <input type="number" id="w" value="1200" min="1" max="10000"></label><label>height <input type="number" id="h" value="630" min="1" max="10000"></label>
  <label>background <input type="color" id="bg" value="#0b2238"></label><label>text colour <input type="color" id="fg" value="#5bbfa1"></label><label>font size <input type="number" id="fs" value="0" min="0" title="0 = auto"></label></div>
<div class="tk-field"><div class="tk-label"><span>text (empty = width × height)</span></div><input id="txt" value="" spellcheck="false"></div>
<div class="tk-row"><button type="button" class="tk-btn primary" id="dl">save SVG</button><button type="button" class="tk-btn" id="dlpng">save PNG</button></div>
<div id="pv" style="margin:10px 0"></div>
<div class="tk-field"><div class="tk-label"><span>SVG</span><span class="r"><button type="button" class="tk-copy" data-copy="#svg">copy</button></span></div><textarea id="svg" readonly spellcheck="false"></textarea></div>
<div class="tk-field"><div class="tk-label"><span>data URI</span><span class="r"><button type="button" class="tk-copy" data-copy="#uri">copy</button></span></div><textarea id="uri" readonly spellcheck="false"></textarea></div>
